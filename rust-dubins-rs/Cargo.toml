[package]
name = "steering-functions-dubins-rs"
version = "0.1.0"
edition = "2021"
description = "Minimal steering functions crate with Dubins and Reeds-Shepp"
license = "Apache-2.0"
repository = "https://github.com/visionnavzks/rust-dubins-rs"
keywords = ["steering", "dubins", "reeds-shepp", "path-planning", "robotics"]
categories = ["algorithms", "simulation"]

[lib]
name = "steering_functions_dubins_rs"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]

[dev-dependencies]
eframe = { version = "0.29", features = ["default"] }
egui_plot = "0.29"
